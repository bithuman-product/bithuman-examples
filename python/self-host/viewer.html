<!doctype html>
<!-- The page agent.py serves on localhost: joins your local LiveKit room, sends your microphone,
     shows the avatar. No build step; livekit-client comes from the jsDelivr CDN. -->
<meta charset="utf-8">
<title>bitHuman avatar</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; background: #111; color: #ddd; font: 15px system-ui, sans-serif; }
  video { max-height: 80vh; max-width: 95vw; background: #000; border-radius: 12px; }
  button { font: inherit; padding: 10px 22px; margin: 14px; border-radius: 8px; cursor: pointer; }
</style>
<video id="avatar" autoplay playsinline></video>
<button id="start">Start — allow the microphone</button>
<div id="status"></div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
<script>
  const q = new URLSearchParams(location.search), el = (id) => document.getElementById(id);
  el("start").onclick = async () => {
    el("start").disabled = true;
    el("status").textContent = "Connecting…";
    const room = new LivekitClient.Room();
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video") track.attach(el("avatar"));
      else document.body.appendChild(track.attach());
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => { el("status").textContent = "Disconnected — reload to start again."; });
    try {
      await room.connect(q.get("liveKitUrl"), q.get("token"));
      await room.localParticipant.setMicrophoneEnabled(true);
      el("status").textContent = "Live — the avatar appears in a few seconds. Say hi.";
    } catch (e) {
      el("status").textContent = "Could not connect: " + e.message + " (is livekit-server --dev running?)";
      el("start").disabled = false;
    }
  };
</script>
