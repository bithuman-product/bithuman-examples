# The Swift examples had no gate at all, so a public example could stop compiling and
# nothing would say so — which is how a 25-vs-20 pacing defect sat in ios-expression2.
#
# Two jobs:
#   typecheck-ios              the two iOS examples are not `swift build` subjects — one
#                              is an xcodegen project and the other is iOS-only source —
#                              so both are typechecked against the PUBLISHED xcframeworks
#                              a developer downloads, pinned by tag AND verified by
#                              sha256, so the subject cannot change under the gate. Each
#                              carries a NEGATIVE CONTROL: the same command on a
#                              deliberately broken copy must FAIL.
#   build-packages             every swift/*/Package.swift that is not iOS-only, built on
#                              macOS, with NO allowlist.
name: swift examples compile

on:
  pull_request:
    paths: ['swift/**', '.github/workflows/swift-examples.yml']
  push:
    branches: [main]
    paths: ['swift/**', '.github/workflows/swift-examples.yml']
  workflow_dispatch:

jobs:
  typecheck-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published xcframeworks (pinned by tag + sha256)
        run: |
          set -euo pipefail
          # ★THE TAGS AND CHECKSUMS BELOW ARE LIFTED FROM Package.swift AT v2.14.2 —
          # they are the bytes `from: "2.14.2"` actually resolves, which is what every
          # example here now pins. Until 2026-09-22 this step fetched v2.6.1, so the
          # gate compiled against bytes no reader of these examples has ever had.
          REL=https://github.com/bithuman-product/homebrew-bithuman/releases/download
          mkdir -p xcf && cd xcf
          fetch() {                       # $1 = tag, $2 = zip name, $3 = expected sha256
            curl -fsSL -o "$2" "$REL/$1/$2"
            GOT=$(shasum -a 256 "$2" | cut -d' ' -f1)
            [ "$GOT" = "$3" ] || { echo "::error::$2 sha256 $GOT != pinned $3"; exit 1; }
            unzip -q "$2"
            echo "$2 OK ($GOT)"
          }
          # expression2Tag in the v2.14.2 manifest
          fetch v2.6.5 Expression2.xcframework.zip            f1fb6775deca2884739432cb0f0c8d85173234c7f1137c3b8a01dd96ac84c732
          fetch v2.6.5 BithumanEngineProtocol.xcframework.zip 1dcb82534267ccb59f3f46681b202d3d1029eb40ef667a953e1f9669be11fe5f
          # REQUIRED, not optional: Expression2's own .swiftinterface starts with
          # `import UnifiedModelHeader`, so omitting it fails with "no such module"
          # before a line of the example is even read. (Found by this job's first run.)
          fetch v2.6.5 UnifiedModelHeader.xcframework.zip     5e3e56a0a1895cb8f9277aee921d7ac30b7318d0fe75e78688f5223507e70c03
          # releaseTag in the v2.14.2 manifest — the umbrella ios-avatar imports
          fetch v2.4.0 bitHumanKit.xcframework.zip            5c536e37919b693591dff234db8627c01952ae24ae58651aeacbd875bd78e9db

      - name: Select a toolchain new enough to read the published module
        run: |
          set -euo pipefail
          # The published Expression2 module (v2.6.5) was built with Swift 6.2.4 (Xcode 26.3); a
          # compiler older than the producer REFUSES it outright ("this SDK is not supported by the
          # compiler"), so pick the newest Xcode the image has and say what we got —
          # that version IS the floor a developer needs, and it belongs in the log.
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          echo "selected: $(xcode-select -p)"
          swift --version

      - name: Typecheck both iOS examples against those bytes
        run: |
          set -euo pipefail
          # Each example is typechecked against ONLY the frameworks it declares,
          # so a missing dependency shows up here instead of being masked by a
          # neighbour's. ios-avatar is in this job and not in `build-packages`
          # because it is iOS-only: `swift build` on a Mac builds it for macOS and
          # dies in the manifest before it reads a line of Swift.
          E2=""
          for x in Expression2 BithumanEngineProtocol UnifiedModelHeader; do
            E2="$E2 -F $PWD/xcf/$x.xcframework/ios-arm64"
          done
          KIT="-F $PWD/xcf/bitHumanKit.xcframework/ios-arm64"

          tc () {                         # $1 = ios target, $2 = -F flags, $3 = file
            xcrun -sdk iphoneos swiftc -typecheck -target "$1" \
              -swift-version 6 -parse-as-library $2 "$3"
          }
          tc arm64-apple-ios17.0 "$E2"  swift/ios-expression2/Sources/App.swift
          echo "PASS: ios-expression2 typechecks against the published binary"
          tc arm64-apple-ios26.0 "$KIT" swift/ios-avatar/Sources/IOSAvatarApp.swift
          echo "PASS: ios-avatar typechecks against the published binary"

      - name: Negative control — the same commands must FAIL on broken copies
        run: |
          set -euo pipefail
          # A gate that cannot fail is not a gate, and this one caught a harness
          # artifact on its first run (a single file handed to swiftc compiles in
          # script mode, which rejects @main in every arm, passing or not).
          E2=""
          for x in Expression2 BithumanEngineProtocol UnifiedModelHeader; do
            E2="$E2 -F $PWD/xcf/$x.xcframework/ios-arm64"
          done
          KIT="-F $PWD/xcf/bitHumanKit.xcframework/ios-arm64"
          mkdir -p /tmp/ctl
          ctl () {                        # $1 = ios target, $2 = -F flags, $3 = file
            cp "$3" /tmp/ctl/Ctl.swift
            printf '\nlet deliberatelyBroken: Int = "this is not an Int"\n' >> /tmp/ctl/Ctl.swift
            if xcrun -sdk iphoneos swiftc -typecheck -target "$1" \
                 -swift-version 6 -parse-as-library $2 /tmp/ctl/Ctl.swift 2>/dev/null; then
              echo "::error::the negative control PASSED for $3 — this gate is not compiling anything"
              exit 1
            fi
            echo "PASS: the gate rejects broken code in $3, so a pass means something"
          }
          ctl arm64-apple-ios17.0 "$E2"  swift/ios-expression2/Sources/App.swift
          ctl arm64-apple-ios26.0 "$KIT" swift/ios-avatar/Sources/IOSAvatarApp.swift

  build-packages:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift build every example that is a SwiftPM package
        run: |
          set -uo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          swift --version

          # ★THIS LIST IS EMPTY AND THE GATE IS NOW HONEST. It used to carry seven
          # entries. Re-measured on an Apple M4 Max (macOS 26.5, Xcode 26.5,
          # Swift 6.3.2) on 2026-09-22, `swift build` against the published tap:
          # SEVEN of the ten packages failed and three built. Six of the seven were
          # dead — they called SDK surfaces that do not exist (`EssenceRuntime`,
          # `Bithuman.createRuntime`, `EssenceFixture`), a product that does not
          # exist (`Expression`), or a path outside this repository — so they were
          # deleted rather than excused. `ios-avatar` is not a `swift build`
          # subject at all: it is iOS-only source, and the job below typechecks it
          # against the iOS SDK instead.
          #
          # An allowlist that can be appended to is a gate that goes green by
          # editing it. Keep this empty: a package that cannot build is either
          # fixed or removed.
          KNOWN_BROKEN=""
          FAILED=""; UNEXPECTED_OK=""
          # iOS-only packages: `swift build` on a Mac builds them FOR macOS and
          # dies in the manifest ("requires macos 10.13, but depends on ...
          # bitHumanKit which requires macos 13.0"). That is a property of the
          # command, not a defect in the example, so they are typechecked against
          # the iOS SDK in the job above instead of being excused here.
          IOS_ONLY="ios-avatar"
          for p in swift/*/Package.swift; do
            d=$(dirname "$p"); n=$(basename "$d")
            case " $IOS_ONLY " in *" $n "*) echo "skip $d (iOS-only; typechecked against the iOS SDK)"; continue;; esac
            echo "::group::$d"
            if (cd "$d" && swift build 2>&1 | tail -30); then
              echo "OK $d"
              case " $KNOWN_BROKEN " in *" $n "*) UNEXPECTED_OK="$UNEXPECTED_OK $n";; esac
            else
              echo "FAIL $d"
              case " $KNOWN_BROKEN " in *" $n "*) echo "  (known broken — not gating)";; *) FAILED="$FAILED $d";; esac
            fi
            echo "::endgroup::"
          done
          if [ -n "$UNEXPECTED_OK" ]; then
            echo "::error::these build but are still listed KNOWN_BROKEN — remove them from the list:$UNEXPECTED_OK"
            exit 1
          fi
          if [ -n "$FAILED" ]; then echo "::error::packages failed to build:$FAILED"; exit 1; fi
          echo "every example outside KNOWN_BROKEN builds, and nothing in KNOWN_BROKEN has quietly started working"
