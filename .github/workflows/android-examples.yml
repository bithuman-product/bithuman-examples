# android examples — both hello projects under android/ build from Maven Central alone,
# and the graph Gradle resolves carries exactly the coordinate each build file names.
#
# ★WHY THE GRAPH STEP. android/README.md says it: a resolution can return rc=0 with a
# dependency absent from the graph. So the build's exit code is not the evidence; the
# coordinate appearing in `:app:dependencies` is.
#
# No API secret here. The apps read theirs from a git-ignored local.properties (or
# BITHUMAN_API_SECRET) into BuildConfig; a build without one compiles and the app says
# on screen that it has no key. CI therefore never holds a key, and the last step
# refuses a committed local.properties.
name: android examples build

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-examples.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-examples.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }} builds from Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [expression2-hello, essence2-hello]
    defaults:
      run:
        working-directory: android/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: no local.properties is committed (it carries the API secret)
        run: |
          if git -C "$GITHUB_WORKSPACE" ls-files android | grep -E '(^|/)local\.properties$'; then
            echo "::error::a local.properties is committed — it holds sdk.dir and the API secret"; exit 1
          fi

      - name: assemble the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: the resolved graph carries the coordinate the build file names
        run: |
          set -euo pipefail
          want=$(grep -oE 'ai\.bithuman:[a-z0-9-]+:[0-9][0-9.]*' app/build.gradle.kts)
          ./gradlew -q --no-daemon :app:dependencies --configuration debugRuntimeClasspath > deps.txt
          grep -F -- "--- $want" deps.txt || { echo "::error::$want is not in the resolved graph"; cat deps.txt; exit 1; }
          ls -l app/build/outputs/apk/debug/app-debug.apk
