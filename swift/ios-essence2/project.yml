# project.yml — `xcodegen generate` writes IOSEssence2.xcodeproj from this.
name: IOSEssence2
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
packages:
  bithuman:
    url: https://gitlab.com/bithuman/sdk/bithuman-swift.git
    # 2.20.1 or newer: the version docs.bithuman.ai/versions.json names. setup.sh
    # fetches the runtime files of the essence2 release this version pins.
    from: 2.20.4
targets:
  IOSEssence2:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Info.plist", "Model", "EngineResources"]
      # The identity rides as ONE folder reference the app opens by name.
      # `optional`: setup.sh creates it, so a fresh clone can still generate.
      - path: Sources/Model
        type: folder
        buildPhase: resources
        optional: true
      # The engine resources ride as individual files, so they land at the
      # bundle ROOT — which is the only place the engine looks for them. They
      # are named one by one (not a `group` of whatever the directory held when
      # the project was generated — that is how a stale project once shipped
      # references to two bundles that no longer exist).
      - path: Sources/EngineResources/w2v_ess_fp16_v1.onnx
        buildPhase: resources
        optional: true
      - path: Sources/EngineResources/audio_encoder_fp16_window_trunk.onnx
        buildPhase: resources
        optional: true
      - path: Sources/EngineResources/audio_encoder_fp16_window_head.onnx
        buildPhase: resources
        optional: true
    dependencies:
      - package: bithuman
        product: Essence2Kit
    preBuildScripts:
      - name: "Sources/Model and Sources/EngineResources must hold real files"
        basedOnDependencyAnalysis: false
        script: |
          # A resource folder copies whatever is there, so without this the app
          # builds, installs, launches and fails on the phone instead of here.
          fail() { echo "error: $1"; exit 1; }
          M="$SRCROOT/Sources/Model"; R="$SRCROOT/Sources/EngineResources"
          [ -f "$M/agent.imx" ] || fail "Sources/Model/agent.imx is missing — run ./setup.sh"
          SZ=$(stat -f%z "$M/agent.imx")
          [ "$SZ" -gt 50000000 ] || fail "Sources/Model/agent.imx is only ${SZ} B — that is an error page or a truncated download. Re-run ./setup.sh"
          [ -f "$M/speech16k.wav" ] || fail "Sources/Model/speech16k.wav is missing — run ./setup.sh"
          for f in w2v_ess_fp16_v1.onnx audio_encoder_fp16_window_trunk.onnx audio_encoder_fp16_window_head.onnx; do
            [ -f "$R/$f" ] || fail "Sources/EngineResources/$f is missing — the .imx does not carry the engine's runtime files. Re-run ./setup.sh"
          done
          echo "payload OK: agent.imx ${SZ} B, front end present"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Essence2
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ios-essence2
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The package's simulator slices are arm64 only. Without this, a build for
        # "Any iOS Simulator Device" (or any xcodebuild -destination 'generic/…')
        # also builds x86_64 and fails with "Unable to find module dependency".
        # (Essence 2 itself runs on a physical device only; this keeps the build green.)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
