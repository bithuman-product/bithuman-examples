# Regenerate the Xcode project with:  xcodegen generate
# (IOSExpression2.xcodeproj is committed, so this is optional.)
name: IOSExpression2
options:
  bundleIdPrefix: ai.bithuman.example
  deploymentTarget:
    iOS: "16.0"                      # Expression2's own floor (the package declares iOS 16)
packages:
  bithuman:
    url: https://github.com/bithuman-product/homebrew-bithuman.git
    from: 2.20.2                     # the version docs.bithuman.ai/versions.json names
targets:
  IOSExpression2:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Info.plist", "Model"]
      - path: Sources/Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: bithuman
        product: Expression2
    preBuildScripts:
      - name: "Sources/Model must hold a real model, not the placeholder"
        basedOnDependencyAnalysis: false
        script: |
          # A resource FOLDER copies whatever is there, so without this the app
          # builds, installs and launches with no model at all and says so only
          # in a log line nobody is reading. Measured 2026-09-09: an untouched
          # checkout with just PLACE_YOUR_MODEL_HERE.txt returns ** BUILD
          # SUCCEEDED **. Fail here instead, where the message is unmissable.
          M="$SRCROOT/Sources/Model"
          fail() { echo "error: $1"; exit 1; }
          for f in agent.imx shared-engine.imx speech16k.wav; do
            [ -f "$M/$f" ] || fail "Sources/Model/$f is missing — run ./setup.sh (or BITHUMAN_API_SECRET=... ./setup.sh <YOUR_AGENT_CODE>)"
          done
          SZ=$(stat -f%z "$M/agent.imx"); SE=$(stat -f%z "$M/shared-engine.imx")
          [ "$SZ" -gt 1000000 ] || fail "Sources/Model/agent.imx is only ${SZ} B — that is an error page or a truncated download, not an avatar. Re-run ./setup.sh"
          [ "$SE" -gt 1000000 ] || fail "Sources/Model/shared-engine.imx is only ${SE} B — a truncated download. Re-run ./setup.sh"
          echo "Sources/Model OK: agent.imx ${SZ} B, shared-engine.imx ${SE} B"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Expression2
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Drive the avatar with your own voice, on-device.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.bithuman.example.ios-expression2
        # Set your own 10-character Apple Developer team id here, or pick the
        # team in Xcode under Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The package's simulator slices are arm64 only. Without this, a build for
        # "Any iOS Simulator Device" (or any xcodebuild -destination 'generic/…')
        # also builds x86_64 and fails with "Unable to find module dependency".
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
